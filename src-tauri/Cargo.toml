[package]
name = "nudge"
description = "Nudge: recordatorios recurrentes de escritorio, locales y sin conexión."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nudge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
nudge-core = { path = "../crates/nudge-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

# Solo para ajustar los botones de la barra de título (ya es dependencia de Tauri en Linux).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
